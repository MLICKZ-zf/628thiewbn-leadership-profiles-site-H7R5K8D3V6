 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadership Directory</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
    <img
        src="images/md-nationalguard-logo.png"
        alt="National Guard Logo"
        class="header-logo"
    >

    <h3>
        628th Intelligence and Electronic Warfare Battalion<br>
        Activation Ceremony Biographies
    </h3>

    <img
        src="images/battalion-logo.png"
        alt="628th Battalion Logo"
        class="header-logo"
    >
</header>

    <main>
    <!-- Landing page -->
    <section id="homeView">
        <div class="landing-content">
            <h1>Leadership Biographies</h1>

            <p class="landing-intro">
                Select a section to view its leadership biographies.
            </p>

            <div id="sectionContainer"></div>
        </div>
    </section>

    <!-- Selected section page -->
    <section id="directoryView" class="hidden">
        <div class="directory-header">
            <button id="backToHome" type="button">
                &larr; Back to Sections
            </button>

            <h1 id="sectionHeading"></h1>
        </div>

        <div id="cardContainer"></div>
    </section>
</main>

    <div id="bioModal" class="modal hidden">
        <div class="modal-content">
            <span id="closeModal">&times;</span>

            <img id="modalImage" src="" alt="">
            <h2 id="modalName"></h2>
            <h3 id="modalTitle"></h3>

            <p id="modalBio"></p>
        </div>
    </div>

    <script src="leaders.js"></script>
    <script src="script.js"></script>

</body>
</html>
<script src="leaders.js?v=2"></script>
<script src="script.js?v=2"></script>
