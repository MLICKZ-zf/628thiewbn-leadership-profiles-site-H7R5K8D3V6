 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadership Directory</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
    <img
        src="images/MDARNG symbol.png"
        alt="Maryland National Guard Logo"
        class="header-logo"
    >

    <h2>
        628th Intelligence and Electronic Warfare Battalion<br>
        Activation Ceremony Biographies
    </h2>

    <img
        src="images/battalion-logo.png"
        alt="628th Battalion Logo"
        class="header-logo"
    >
</header>

    <nav id="tabs"></nav>

    <main>
        <div id="cardContainer"></div>
    </main>

    <div id="bioModal" class="modal hidden">
        <div class="modal-content">
            <span id="closeModal">&times;</span>

            <img id="modalImage" src="" alt="">
            <h2 id="modalName"></h2>
            <h3 id="modalTitle"></h3>

            <p id="modalBio"></p>
        </div>
    </div>

    <script src="leaders.js"></script>
    <script src="script.js"></script>

</body>
</html>
